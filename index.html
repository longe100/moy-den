<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-pal="lux"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мой дневник</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&family=Unbounded:wght@500;700&display=swap">
<style>
@property --acc{syntax:"<color>";inherits:true;initial-value:#5b86ff}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-theme=dark]{color-scheme:dark;--bg:#09090b;--card:#131316;--ink:#f5f5f4;--mut:#85858f;--line:#232329;--on:#07070a;--in:#2fe0a8;--out:#ff5a7e;--a-day:#5b86ff;--a-fin:#1fd6a4;--a-work:#a070ff;--a-food:#ff8f2e;--a-gym:#ff4f7b}
:root[data-theme=light]{color-scheme:light;--bg:#f6f6f8;--card:#fff;--ink:#0a0a0c;--mut:#6c6c78;--line:#e3e3e9;--on:#fff;--in:#00946e;--out:#e11d48;--a-day:#2f5cff;--a-fin:#00a67d;--a-work:#7a3cff;--a-food:#f26a00;--a-gym:#ee2c5e}
body[data-tab=day]{--acc:var(--a-day)}body[data-tab=fin]{--acc:var(--a-fin)}body[data-tab=work]{--acc:var(--a-work)}body[data-tab=food]{--acc:var(--a-food)}body[data-tab=gym]{--acc:var(--a-gym)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Onest,system-ui,sans-serif;transition:--acc .45s ease}
main{max-width:640px;margin:0 auto;padding:0 20px 150px}
.hero{position:relative;overflow:hidden;margin:0 -20px 8px;padding:22px 20px 6px}
.hero::before{content:"";position:absolute;width:340px;height:340px;left:-110px;top:-150px;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 50%,transparent),transparent 68%);pointer-events:none}
.hero>*{position:relative}.hero small{color:var(--mut);font-weight:600}
.hero h1{display:flex;align-items:flex-end;gap:14px;margin:18px 0 22px;font-weight:400}
.hero h1 b{font:700 92px/.85 Unbounded,Onest,sans-serif;letter-spacing:-.04em}

.tb{display:flex;align-items:center;justify-content:space-between}.tb div{display:flex;gap:4px}
.tb button{background:none;color:var(--mut);border:0;border-radius:20px;min-width:40px;height:36px;padding:0 10px;font-weight:600}

.wk button.sel{background:var(--acc)}.wk button.sel small,.wk button.sel b{color:var(--on)}
.wk button.td b{text-decoration:underline;text-underline-offset:3px}
.wk button i{position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--acc)}.wk button.sel i{background:var(--on)}
input,select{background:transparent;color:var(--ink);border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 2px;font:inherit;min-width:0;min-height:44px;transition:border-color .2s}

.btn{background:var(--acc);color:var(--on);border:0;border-radius:24px;padding:0 20px;min-height:44px;font-weight:700}
.sec{background:none;color:var(--ink);border:1px solid var(--line);margin-top:12px;width:100%}
.g{background:none;border:0;color:var(--mut);min-width:40px;min-height:40px}
section{padding:22px 0;border-top:1px solid var(--line)}section.top{border-top:0;display:flex;gap:18px;align-items:center}
h2{font-size:13px;font-weight:600;margin:0 0 12px;color:var(--mut)}section.top h2{font-size:22px;color:var(--ink);font-weight:800;margin:0}
h3{font-size:13px;margin:14px 0 2px;color:var(--mut)}
form{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}form>*{flex:1 1 90px}form .btn{flex:0 0 auto}
label.mut{display:block}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}.row .s{flex:1}.row.done .s{text-decoration:line-through;color:var(--mut)}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:24px;height:24px;min-height:0;flex:none;padding:0;border:2px solid var(--mut);border-radius:50%;display:grid;place-items:center;cursor:pointer}
input[type=checkbox]:checked{background:var(--acc);border-color:var(--acc)}
input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid var(--on);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.mut,.empty,small{color:var(--mut)}.in{color:var(--in)}.out{color:var(--out)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}.tile{padding:16px 0;border-top:1px solid var(--line)}
.tile small{display:block;margin-bottom:2px}.tile b,.kpi b{font:700 20px Unbounded,Onest,sans-serif;display:block}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kpi small{display:block;margin-bottom:2px}
.ring{width:88px;flex:none}.ring circle{fill:none;stroke:var(--line);stroke-width:5}.ring .v{stroke:var(--acc);stroke-linecap:round;transition:stroke-dasharray .4s;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--acc) 70%,transparent))}.ring text{fill:var(--ink);font:700 14px Onest}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.br{display:grid;grid-template-columns:92px 1fr auto;gap:12px;align-items:center;margin:10px 0}
.water{display:flex;flex-wrap:wrap}.dr{background:none;border:0;opacity:.2;padding:4px 3px;transition:opacity .2s,transform .2s}.dr.on{opacity:1}.dr:active{transform:scale(.8)}.dr svg{width:28px;height:28px;fill:#1fb5ff;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal span{color:var(--mut);font-size:12px}
.cal .c{background:none;border:1px solid transparent;border-radius:12px;min-height:50px;padding:4px 0;color:var(--ink)}.cal .c small{display:block;font-size:10px}
.cal .c.w{background:var(--acc);color:var(--on)}.cal .c.w small{color:var(--on)}.cal .c.sel{border-color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.chips button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:6px 14px}
.dh{background:none;border:0;font-weight:700;color:var(--ink);padding:12px 0 2px;display:block;width:100%;text-align:left}.dh.sel{color:var(--acc)}
.hb{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}.hb .s b{font-weight:600}
.chk{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:none;color:var(--on);flex:none;display:grid;place-items:center;transition:.2s}.chk:active{transform:scale(.85)}
.chk.on{background:var(--acc);border-color:var(--acc)}.chk svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}.chk.on svg{opacity:1}
.dots{display:flex;gap:4px;margin-top:5px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--acc)}.st{font:700 13px Unbounded,Onest,sans-serif;color:var(--acc)}
.bl{flex:0 0 auto!important;display:flex;align-items:center;color:var(--mut);padding:0 6px;cursor:pointer}.bl input{display:none}.bl:has(:checked){color:var(--acc)}
.bi{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-right:3px;color:var(--acc)}.bl .bi{width:24px;height:24px;margin:0;color:inherit}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 24px),400px);height:62px;padding:6px;display:flex;border:1px solid var(--line);border-radius:31px;background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 12px 40px rgba(0,0,0,.28);z-index:4}
nav button{flex:1;position:relative;z-index:1;background:none;border:0;color:var(--mut);font-size:0;display:grid;place-items:center;transition:color .25s}nav button.on{color:var(--acc)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}nav button span{display:block;transition:transform .35s cubic-bezier(.3,1.6,.4,1)}nav button.on span{transform:scale(1.18)}
.ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:25px;background:color-mix(in srgb,var(--acc) 20%,transparent);transition:transform .45s cubic-bezier(.3,1.3,.4,1)}
.fab{position:fixed;right:max(18px,calc(50% - 302px));bottom:calc(92px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--on);border:0;font-size:30px;line-height:1;box-shadow:0 10px 30px color-mix(in srgb,var(--acc) 50%,transparent);transition:transform .2s;z-index:3}.fab:active{transform:scale(.9) rotate(90deg)}
#toast{position:fixed;left:50%;bottom:calc(168px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 8px 6px 18px;border-radius:24px;display:flex;gap:6px;align-items:center;transition:.25s;z-index:5}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}#toast button{background:none;border:0;color:inherit;font-weight:800;text-decoration:underline;min-height:40px;padding:0 12px}
#al,#ed,#st{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}#al.show,#ed.show,#st.show{opacity:1;pointer-events:auto}
#al .box,#ed .box,#st .box{background:var(--card);border:1px solid var(--line);border-radius:32px;padding:30px 24px 18px;width:min(88%,360px);text-align:center;transform:scale(.9);transition:transform .35s cubic-bezier(.3,1.4,.4,1)}#al.show .box,#ed.show .box,#st.show .box{transform:none}
#al .big{width:60px;height:60px;fill:none;stroke:var(--acc);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transform-origin:50% 10%;animation:sw 1.1s ease-in-out infinite}
#al h2,#ed h2,#st h2{font-size:22px;color:var(--ink);margin:12px 0 2px}#al .btn,#ed .btn,#st .btn{width:100%;margin-top:10px}
@keyframes sw{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
@keyframes inR{from{opacity:0;transform:translateX(30px)}}@keyframes inL{from{opacity:0;transform:translateX(-30px)}}@keyframes inF{from{opacity:0;transform:translateY(6px)}}
@keyframes grow{from{transform:scaleX(0)}}@keyframes dash{from{stroke-dasharray:0 170}}
.aR>*{animation:inR .42s cubic-bezier(.2,.8,.2,1) both}.aL>*{animation:inL .42s cubic-bezier(.2,.8,.2,1) both}.aF>*{animation:inF .28s ease-out both}
#v>*:nth-child(2){animation-delay:.05s}#v>*:nth-child(3){animation-delay:.1s}#v>*:nth-child(4){animation-delay:.15s}#v>*:nth-child(n+5){animation-delay:.2s}
.aR .bar i,.aL .bar i{transform-origin:left;animation:grow .8s .15s cubic-bezier(.2,.8,.2,1) both}.aR .ring .v,.aL .ring .v{animation:dash .9s .1s ease-out both}
@media(hover:hover){.btn:hover,.fab:hover{filter:brightness(1.1)}.g:hover,.chips button:hover{color:var(--ink)}.row:hover,.hb:hover{background:color-mix(in srgb,var(--acc) 6%,transparent)}.cal .c:hover{border-color:var(--acc)}nav button:hover{color:var(--ink)}}
@media(max-width:380px){.hero h1 b{font-size:76px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;display:block;margin:auto}.hero h1{cursor:pointer}.s[data-e]{cursor:pointer}
.g.on{color:var(--acc)}.g .ic{width:18px;height:18px}
:root[data-theme=dark]{--bg:#07080c;--card:#0f1117;--line:#1c1f2a;--ink:#f1ece2;--mut:#8a8b98;--on:#0a0a0d;--a-day:#d9b26f;--a-fin:#3ecf9a;--a-work:#8b7bff;--a-food:#ff9a5c;--a-gym:#ff5d73}
